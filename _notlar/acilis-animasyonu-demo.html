<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acilis Animasyonu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FCF9F3;color:#040404;font-family:-apple-system,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
.altyazi{text-align:center;max-width:460px;padding:24px;line-height:1.7;font-size:15px;color:#474747}
button{margin-top:20px;padding:12px 26px;font:inherit;font-size:14px;letter-spacing:.06em;background:#040404;color:#fff;border:0;border-radius:2px;cursor:pointer}
.intro{position:fixed;inset:0;z-index:100;background:#040404;color:#fff}
.intro__logo{position:absolute;left:50%;top:50%;width:clamp(220px,56vw,560px);height:auto;transform:translate(-50%,-50%);transform-origin:50% 50%;overflow:visible}
.intro.oynat{animation:intro-fade .5s ease 2.4s both}
.intro.oynat .intro__letters{animation:intro-letters .5s ease .65s both}
.intro.oynat .intro__bracket--tr{animation:intro-bracket-tr .8s cubic-bezier(.2,.7,.1,1) .1s both}
.intro.oynat .intro__bracket--bl{animation:intro-bracket-bl .8s cubic-bezier(.2,.7,.1,1) .1s both}
@keyframes intro-letters{0%{opacity:0}100%{opacity:1}}
@keyframes intro-bracket-tr{0%{transform:translateX(-402px)}100%{transform:none}}
@keyframes intro-bracket-bl{0%{transform:translateX(402px)}100%{transform:none}}
@keyframes intro-fade{100%{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.intro.oynat .intro__letters,.intro.oynat .intro__bracket--tr,.intro.oynat .intro__bracket--bl{animation:none}.intro.oynat{animation-delay:.8s}}
</style></head>
<body>
<div class="altyazi">
  <strong style="color:#040404">Acilis animasyonu</strong><br>
  Figma'daki hareketin birebir kod karsiligi. Parantezler disari acilir, isim belirir, ekran kararir ve site gorunur.
  <br><button id="tekrar">Tekrar oynat</button>
</div>
